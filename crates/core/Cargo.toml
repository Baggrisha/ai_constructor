[package]
name = "aic-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
cosmic-text = { version = "0.19", default-features = false, features = ["std", "fontconfig"] }
fs2 = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ttf-parser = "0.25"
thiserror = "2.0"
unicode-linebreak = "0.1.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"

[dev-dependencies]
font-test-data = "0.10.1"
tempfile = "3.20"
