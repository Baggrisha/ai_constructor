[package]
name = "aic-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
fs2 = "0.4.3"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
